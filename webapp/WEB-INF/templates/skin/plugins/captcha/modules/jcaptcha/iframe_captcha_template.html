<div class="form-group">
	<label class="col-xs-12 control-label"  for="j_captcha_response">* #i18n{module.captcha.jcaptcha.message.response} :</label>
	<div class="col-xs-12">
		<div class="well well-sm">
				<iframe class="jcaptchaframe" src="JCaptchaImage" name="captchaImage" id="captchaImage" data-original-title="#i18n{module.captcha.jcaptcha.message.image}" scrolling="no" frameborder="no">
					<img src="JCaptchaImage" alt=""  />
				</iframe>
				<br>
				<div class="input-group">
					<input type="text" id="j_captcha_response" class="form-control" style="margin-bottom:0 !important;" name="j_captcha_response" value="" />
					<input type="text" name="jcaptchahoneypot" value="" class="jchp" />
					<div class="input-group-btn">
						<a class="btn btn-primary btn-sm" id="reloadCaptcha" href="javascript:window.captchaImage.location.reload();" title="#i18n{module.captcha.jcaptcha.message.reloaded}">
							<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-reload"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M19.933 13.041a8 8 0 1 1 -9.925 -8.788c3.899 -1 7.935 1.007 9.425 4.747" /><path d="M20 4v5h-5" /></svg>
						</a>
						<a class="btn btn-primary btn-sm" id="JCaptchaSound" href="JCaptchaSound" title="#i18n{module.captcha.jcaptcha.message.sound}" data-original-title="#i18n{module.captcha.jcaptcha.message.sound}"  target="_blank">
							<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-volume"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M15 8a5 5 0 0 1 0 8" /><path d="M17.7 5a9 9 0 0 1 0 14" /><path d="M6 15h-2a1 1 0 0 1 -1 -1v-4a1 1 0 0 1 1 -1h2l3.5 -4.5a.8 .8 0 0 1 1.5 .5v14a.8 .8 0 0 1 -1.5 .5l-3.5 -4.5" /></svg>
						</a>
						<a class="btn btn-primary btn-sm" id="captchaInfo" href="#" rel="tooltip" data-original-title="#i18n{module.captcha.jcaptcha.message.warning}"><i class="fa fa-question" title="#i18n{module.captcha.jcaptcha.message.help}"></i></a>
					</div>
				</div>
		</div>
	</div>
</div>

<script>
	var isSound=0;
	var captchaUrl="";
	
	$( function(){
		$("#captchaInfo").tooltip({placement:'right'});
		captchaUrl = $(".jcaptchaframe").attr("src");
	});
	
	$("#JCaptchaSound").click( 
		function(e){ 
			e.preventDefault();
			if( isSound==0){
				$(".jcaptchaframe").attr("src", $(this).attr("href"));
				$(this).attr("title", $(".jcaptchaframe").attr("data-original-title") );
				isSound=1;
			} else {
				$(".jcaptchaframe").attr("src", captchaUrl);
				$(this).attr("title", $(this).attr("data-original-title"));
				isSound=0;
			}
			$(".icon-volume-up").toggleClass("icon-eye-open");
			$("#soundInfo").toggle();
		}
	);
	$("#reloadCaptcha").click( function(e){ window.captchaImage.location.reload();} );
	$("#captchaInfo").click( function(e){ e.preventDefault();} );
</script>
